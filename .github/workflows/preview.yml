name: Preview

# Uploads a non-promoted version of the staging Worker per PR and comments its preview URL.
# Forks get no secrets, so previews only run for branches of this repository.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: staging
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_INDEXABLE: 'false'
      BUSINESS_WHATSAPP_NUMBER: ${{ vars.BUSINESS_WHATSAPP_NUMBER }}
      BUSINESS_PHONE_NUMBER: ${{ vars.BUSINESS_PHONE_NUMBER }}
      BUSINESS_FACEBOOK_URL: ${{ vars.BUSINESS_FACEBOOK_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Upload preview version
        id: upload
        working-directory: apps/api
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload --env staging \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} @ ${GITHUB_SHA::7}" \
            --var SITE_URL:"$SITE_URL" --var SITE_INDEXABLE:false \
            --var BUSINESS_WHATSAPP_NUMBER:"$BUSINESS_WHATSAPP_NUMBER" \
            ${BUSINESS_PHONE_NUMBER:+--var BUSINESS_PHONE_NUMBER:"$BUSINESS_PHONE_NUMBER"} \
            --var BUSINESS_FACEBOOK_URL:"$BUSINESS_FACEBOOK_URL" \
            --var APP_VERSION:"pr-${PR_NUMBER}-${GITHUB_SHA::7}" | tee upload.log
          url=$(grep -oE 'https://pr-[A-Za-z0-9.-]+\.workers\.dev' upload.log | head -1 || true)
          if [[ -z "$url" ]]; then
            echo "::error::Preview URL not found in the Wrangler output. Check upload.log format."
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = '<!-- preview-url -->';
            const body = `${marker}\n🔍 **Preview:** ${process.env.PREVIEW_URL || '(URL not found in the Wrangler output)'}\n\nCommit \`${context.sha.slice(0, 7)}\`. Uses staging bindings. Google sign-in doesn't work on preview URLs.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
