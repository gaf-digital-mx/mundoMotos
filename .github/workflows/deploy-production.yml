name: Deploy production (manual)

# Redeploys an existing release tag: config changes (GitHub Environment variables) or recovery.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (e.g. v1.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  production:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      ref: ${{ inputs.tag }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
