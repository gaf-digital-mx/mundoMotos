name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Tap …
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
  - type: input
    id: device
    attributes:
      label: Device / browser
      placeholder: e.g. Android 15, Chrome 140
