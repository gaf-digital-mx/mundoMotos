# Git hooks (installed by `pnpm install` via the `prepare` script).
# Lint runs inside each package so ESLint picks up its own config, tsconfig and path aliases.
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,mjs,cjs,json,jsonc,css,md,yml,yaml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: lint web
      root: apps/web/
      glob: '*.{ts,tsx,js,mjs}'
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    - name: lint api
      root: apps/api/
      glob: '*.{ts,js}'
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    - name: lint contracts
      root: packages/contracts/
      glob: '*.{ts,js}'
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    - name: lint eslint-config
      root: packages/eslint-config/
      glob: '*.js'
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    - name: lint root tooling
      glob: '{*.{js,cjs,mjs},scripts/**/*.{js,mjs}}'
      run: pnpm exec eslint --no-warn-ignored {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
