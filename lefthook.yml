# Git hooks (installed by `pnpm install` via the `prepare` script).
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,mjs,cjs,json,jsonc,css,md,yml,yaml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{ts,tsx,js,mjs,cjs}'
      # Resolve the nearest eslint.config.js per file (each package has its own).
      run: pnpm exec eslint --flag v10_config_lookup_from_file --no-warn-ignored {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
